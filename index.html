<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bol LVB Voorraad</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 p-4 font-sans antialiased"><div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6"><h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Voorraad & Instellingen</h1><p class="text-center text-xs text-gray-500 mb-6">Laatste Bol check: 10-03-2026 14:09:59</p><div class="space-y-4 mb-6"></div>
        <button id="saveBtn" onclick="saveAll()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-md">
            Instellingen Opslaan
        </button>
        <script>
        async function saveAll() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = 'Bezig met opslaan...';
            btn.disabled = true;

            const inputs = document.querySelectorAll('.voorraad-input');
            let newData = {};

            inputs.forEach(input => {
                const ean = input.getAttribute('data-ean');
                const val = parseInt(input.value);
                const title = input.getAttribute('data-title');
                newData[ean] = { "titel": title, "min_voorraad": val };
            });

            try {
                const response = await fetch('https://api.jsonbin.io/v3/b/69b0245db9c05c7732af5647', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2a$10$jUbkjyvwBA1hgPM4EjWR0eQLFtK8lnPgxaWh.Jjd1VVHyLzjGZ5v2' },
                    body: JSON.stringify(newData)
                });
                if(response.ok) {
                    btn.innerText = '✅ Instellingen Opgeslagen!';
                    btn.classList.replace('bg-blue-600', 'bg-green-600');
                    setTimeout(() => {
                        btn.innerText = 'Instellingen Opslaan';
                        btn.disabled = false;
                        btn.classList.replace('bg-green-600', 'bg-blue-600');
                    }, 3000);
                } else { throw new Error('Mislukt'); }
            } catch (error) {
                alert('Fout bij opslaan! Controleer je verbinding.');
                btn.innerText = 'Instellingen Opslaan';
                btn.disabled = false;
            }
        }
        </script>
        </div></body></html>
