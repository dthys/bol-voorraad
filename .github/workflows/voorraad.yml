name: Check Bol Voorraad

# Bepaal wanneer dit script moet draaien
on:
  schedule:
    # Dit betekent: draai elke dag om 08:00, 12:00 en 16:00 UTC (09:00, 13:00, 17:00 onze tijd)
    - cron: '0 8,12,16 * * *'
  workflow_dispatch: # Zodat je op een knop 'Run workflow' kunt klikken in GitHub

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub moet toestemming hebben om de index.html aan te passen

    steps:
      - name: Haal de code op
        uses: actions/checkout@v4
        
      - name: Installeer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installeer benodigde packages
        run: pip install requests
        
      - name: Draai het Python Script (Haal data op & Maak HTML)
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py
        
      - name: Bewaar de nieuwe index.html op GitHub
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add index.html
          # Sla de fout over als er geen veranderingen zijn
          git commit -m "Automatische update voorraadpagina" || exit 0
          git push
